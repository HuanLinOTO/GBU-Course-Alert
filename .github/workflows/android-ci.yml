name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Test · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 含 Gradle 依赖缓存与 wrapper 校验
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 默认分支可写缓存，其余分支只读，避免缓存污染
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # 确保缺失的 compileSdk（android-37）可被 AGP 自动下载
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 无 keystore.properties 时 assembleRelease 自动回退 debug 签名，同时验证 R8/ProGuard 规则
      - name: Build, test and lint
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug --stacktrace --console=plain

      # 以 versionName 规范命名 APK：GBU-Course-Alert-vX.Y.Z-{debug,release}.apk
      - name: Collect APKs
        if: success()
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p apk-out
          cp app/build/outputs/apk/debug/*.apk "apk-out/GBU-Course-Alert-v${version}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "apk-out/GBU-Course-Alert-v${version}-release.apk"

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GBU-Course-Alert-v${{ env.VERSION }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 14

      # 打 v* tag 推送时自动创建 GitHub Release 并附上 APK
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## 更新内容

          - 修复：设置页「从教务系统校准」此前需已登录才能获取——现在会自动用已存凭据登录后再校准，会话过期自动重登；登录失败显示真实原因，触发验证码时提供「打开网页登录」入口
          - Live Update：通知自带系统级到期移除，下课时刻由系统直接清除——即使闹钟被 Doze 限流或未授予精确闹钟权限，倒计时也不会走到负数
          - Live Update：tick 对齐到开课/下课阶段边界，边界切换至多迟一个闹钟派发延迟；精确闹钟未授权时先探测再降级，减少无谓异常
          - 深色模式：今日页状态卡、周课表实验课色块改用暗容器底 + 浅色字，不再刺眼
          - 小组件：文本颜色显式跟随主题，修复深色下看不清

          > CI 构建的 APK 使用独立的调试签名，覆盖安装本地构建版本时请先卸载。
          EOF
          gh release create "$GITHUB_REF_NAME" apk-out/*.apk \
            --title "GBU课表 $GITHUB_REF_NAME" \
            --notes-file release-notes.md

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
