name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Test · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 含 Gradle 依赖缓存与 wrapper 校验
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 默认分支可写缓存，其余分支只读，避免缓存污染
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # 确保缺失的 compileSdk（android-37）可被 AGP 自动下载
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 从 Secrets 还原 release 签名密钥。缺失即中止，避免静默回退成 debug 签名
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 缺失：release 会回退 debug 签名，已中止"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      # 同时验证 R8/ProGuard 规则；release 使用上一步还原的正式签名
      - name: Build, test and lint
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug --stacktrace --console=plain

      # 签名指纹必须与本地构建一致，否则说明密钥不一致（防止悄悄退回 debug 签名）
      - name: Verify release signing
        env:
          EXPECTED_CERT_SHA256: 558421073aad7f2b3510e4d6597286dcb39627b2affa0448c953d3f471cc0924
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          DIGEST=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk \
            | grep -i 'certificate SHA-256 digest' | head -n1 \
            | sed 's/.*digest: *//' | tr -d ':[:space:]' | tr 'A-Z' 'a-z')
          echo "release cert SHA-256: $DIGEST"
          if [ "$DIGEST" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::release APK 签名指纹与预期不符（期望 $EXPECTED_CERT_SHA256）"
            exit 1
          fi

      # 以 versionName 规范命名 APK：GBU-Course-Alert-vX.Y.Z-{debug,release}.apk
      - name: Collect APKs
        if: success()
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p apk-out
          cp app/build/outputs/apk/debug/*.apk "apk-out/GBU-Course-Alert-v${version}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "apk-out/GBU-Course-Alert-v${version}-release.apk"

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GBU-Course-Alert-v${{ env.VERSION }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 14

      # 打 v* tag 推送时自动创建 GitHub Release 并附上 APK
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## 更新内容

          - **导出到日历（.ics）**：设置页新增「导出到日历」分组，整学期课表一键导出为标准 .ics 文件（每节课自带上课提醒），可保存到文件或直接分享给日历应用导入
          - **首次使用升级为五步向导**：地址探测 → 登录 → 权限 → 提醒 → 完成，支持上一步/返回键回退；服务器地址自动探测可达性，设置页新增「重新运行向导」入口
          - **今日休息**：今日页顶部新增「休息」开关——当天不想被打扰时一键取消全部上课提醒与实时倒计时，桌面小组件同步显示「今日休息」；仅对当日生效，跨零点自动恢复，重排也不会把当天的提醒排回来
          - 修复：向导中地址探测失败时不再把错误地址写入配置
          - CI：本地与 CI 统一 release 签名密钥，构建后自动校验签名指纹

          > 首次使用需向学校获取教务系统与统一认证地址。
          > 本地与 CI 使用同一 release 签名密钥，可相互覆盖安装；从旧版本（debug 签名）升级需先卸载一次。
          EOF
          gh release create "$GITHUB_REF_NAME" apk-out/*.apk \
            --title "GBU课表 $GITHUB_REF_NAME" \
            --notes-file release-notes.md

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
