name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Test · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 含 Gradle 依赖缓存与 wrapper 校验
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 默认分支可写缓存，其余分支只读，避免缓存污染
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # 确保缺失的 compileSdk（android-37）可被 AGP 自动下载
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 从 Secrets 还原 release 签名密钥。缺失即中止，避免静默回退成 debug 签名
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 缺失：release 会回退 debug 签名，已中止"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      # 同时验证 R8/ProGuard 规则；release 使用上一步还原的正式签名
      - name: Build, test and lint
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug --stacktrace --console=plain

      # 签名指纹必须与本地构建一致，否则说明密钥不一致（防止悄悄退回 debug 签名）
      - name: Verify release signing
        env:
          EXPECTED_CERT_SHA256: 558421073aad7f2b3510e4d6597286dcb39627b2affa0448c953d3f471cc0924
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          DIGEST=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk \
            | grep -i 'certificate SHA-256 digest' | head -n1 \
            | sed 's/.*digest: *//' | tr -d ':[:space:]' | tr 'A-Z' 'a-z')
          echo "release cert SHA-256: $DIGEST"
          if [ "$DIGEST" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::release APK 签名指纹与预期不符（期望 $EXPECTED_CERT_SHA256）"
            exit 1
          fi

      # 以 versionName 规范命名 APK：GBU-Course-Alert-vX.Y.Z-{debug,release}.apk
      - name: Collect APKs
        if: success()
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p apk-out
          cp app/build/outputs/apk/debug/*.apk "apk-out/GBU-Course-Alert-v${version}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "apk-out/GBU-Course-Alert-v${version}-release.apk"

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GBU-Course-Alert-v${{ env.VERSION }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 14

      # 打 v* tag 推送时自动创建 GitHub Release 并附上 APK
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## 更新内容

          - **登录/同步失败现在能定位了**：接口出错不再只显示「同步失败：接口异常」，而是说明失败环节与最可能原因（如「认证接口返回的不是登录结果（认证地址可能不正确）」）；新增「复制错误详情」按钮，可一次性复制环节 / 地址 / HTTP 状态 / 响应片段 / 版本 / 时间反馈给开发者
          - **修复：设置页改学号或密码后不生效**：原来保存后仍复用旧登录会话，新凭据根本没被使用；现在改为先用新凭据登录、成功才保存，失败时保留原凭据与登录状态，不会把应用弄坏
          - **修复：错误提示会自己消失**：设置页与登录页的提示原先会被今日页抢走并在约 4 秒后清空；现在常驻显示，直到下一次操作
          - 修复：更改学号但密码留空时就地提示，避免用新学号搭配旧密码登录

          > 首次使用需向学校获取教务系统与统一认证地址。
          > 本地与 CI 使用同一 release 签名密钥，可相互覆盖安装；从旧版本（debug 签名）升级需先卸载一次。
          EOF
          gh release create "$GITHUB_REF_NAME" apk-out/*.apk \
            --title "GBU课表 $GITHUB_REF_NAME" \
            --notes-file release-notes.md

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
